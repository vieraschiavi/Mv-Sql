name: Tests

# Corre TODA la suite (web + app-python) en cada push y en cada pull
# request. Antes no existía: el único workflow del repo era el de armar
# releases, que solo se dispara al taggear — así que un push podía romper
# los tests y nadie se enteraba hasta el próximo release.
#
# El gate está probado: tools/correr-tests.mjs sale con código != 0 si
# falla cualquier archivo de test, y este job falla con él.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Si se pushea dos veces seguidas a la misma rama, la corrida vieja se
# cancela en vez de terminar tarde. Sin esto, una corrida ya superada
# puede fallar DESPUES de que el commit nuevo la arregló, y el PR queda
# con la cruz roja de un commit que ya no existe — un "error" que no es
# un error, pero que hay que ir a leer para darse cuenta.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Las tres actions van en su major actual (v7). No es "estar al dia"
      # por deporte: GitHub ya avisa en cada corrida que las v4/v5 corren
      # sobre Node 20, que esta deprecado, y que por ahora las FUERZA a
      # Node 24. Cuando saquen ese salvavidas, esas versiones dejan de
      # arrancar y TODO PR de este repo falla de golpe, sin que nadie haya
      # tocado una linea de codigo. Se adelanta el cambio mientras es una
      # linea, en vez de descubrirlo el dia que rompe.
      - uses: actions/checkout@v7
        with:
          # Historia completa, no el clon shallow por defecto.
          #
          # instalador-al-dia.test.js compara FECHAS DE COMMIT (¿el .exe
          # publicado quedó más viejo que el código?). En un clon shallow
          # el único commit no tiene padre, así que git reporta TODOS los
          # archivos como creados en ese mismo commit: todas las fechas
          # dan iguales, ninguna comparación puede ser "más nuevo que", y
          # el test pasaba en verde sin probar nada.
          #
          # Medido: en un clon --depth 1 de este repo el test daba 3/3 en
          # verde mientras que con la historia completa fallaba de verdad
          # (el .exe publicado estaba desactualizado). O sea que el gate
          # existía y no gateaba.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Node 20 quedo fuera de soporte. La suite entera (34 archivos)
          # ya se corre en Node 22 en desarrollo, asi que subir aca no es
          # un salto a ciegas: es alinear CI con donde ya se prueba.
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: npm ci

      - name: Correr la suite completa (web + app-python)
        run: npm test

      - name: Linter
        run: npm run lint
