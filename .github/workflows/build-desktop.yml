name: Build MV SQL NLP releases

# Compila el instalador de Windows (Electron + React) en un runner Windows
# real, con acceso de red sin restricciones: ahí sí se puede compilar el
# módulo nativo de SQLite (better-sqlite3) y descargar el binario de
# Electron para win32-x64. También sube al mismo Release el producto
# completo (Python/Streamlit): el zip autoinstalable de siempre, y el
# instalador .exe (NSIS) con selector de carpeta y desinstalador real.
#
# Los módulos con la lógica sensible (motor.py, proveedores_ia.py,
# licencia.py) se compilan con Cython a .pyd ANTES de empaquetar — un
# segundo runner windows-latest hace ese build (necesita un compilador de
# C real apuntando a Windows, algo que el runner de Linux de acá abajo no
# puede producir) y el job de empaquetado usa el .pyd en vez del .py
# fuente. Ver tools/build_cython.py para el detalle y las limitaciones.
#
# Se dispara de tres maneras, y las tres terminan en el mismo Release
# (https://github.com/<owner>/<repo>/releases):
#
#   1. Al mergear a main, PERO solo si la versión de desktop/package.json
#      todavía no tiene Release. Es el camino normal: subís la versión,
#      mergeás, y sale solo. Sin esa condición, cada merge a main
#      reintentaría publicar el mismo tag una y otra vez.
#   2. Al pushear un tag "v*" (ej. v1.0.1).
#   3. A mano desde la pestaña Actions ("Run workflow").
#
# En los casos 2 y 3 se compila siempre: el disparo es explícito, así que
# rehacer un Release existente es justamente lo que se está pidiendo.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Decide si hay algo para publicar. Va en un job aparte y no en un "if"
  # de cada job porque necesita leer la versión del repo y preguntarle a
  # la API si ese Release ya existe — eso no entra en una expresión.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.d.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag y dispatch: siempre. Solo se evalúa el push a una rama.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo explícito (${{ github.event_name }}): se compila."
            echo "seguir=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(node -p "require('./desktop/package.json').version")
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V ya tiene Release: no hay versión nueva para publicar."
            echo "Para publicar, subí la versión en desktop/package.json." >> "$GITHUB_STEP_SUMMARY"
            echo "seguir=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$V no tiene Release todavía: se compila y se publica."
            echo "seguir=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows-exe:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend (Vite)
        run: npm run build

      - name: Generar instalador Windows (NSIS + portable + zip)
        run: npx electron-builder --win nsis portable zip --x64 --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cython-windows:
    needs: decidir
    if: needs.decidir.outputs.seguir == 'true'
    # Corre en windows-latest porque necesita el compilador de C de
    # Visual Studio (ya viene instalado en la imagen del runner) para
    # producir extensiones .pyd de verdad — un .so de Linux no le sirve
    # de nada al cliente de Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Cython
        run: pip install cython
      - name: Compilar motor.py / proveedores_ia.py / licencia.py a .pyd
        run: python tools/build_cython.py
      - uses: actions/upload-artifact@v4
        with:
          name: mvsql-pyd
          path: app-python/*.pyd
          if-no-files-found: error

  attach-python-downloads:
    needs: [build-windows-exe, build-cython-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determinar version y tag del Release
        id: version
        # electron-builder etiqueta el Release según version en package.json,
        # no según el ref que disparó el workflow — por eso lo leemos de ahí
        # en vez de usar github.ref_name (que en un disparo manual es "main",
        # no una versión, y antes hacía que este job se salteara siempre).
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: mvsql-pyd
          path: app-python
      - name: Sacar el .py fuente de lo que ya se compiló a .pyd
        # Sin esto se empaquetarían los dos: el .py en claro al lado del
        # .pyd anularía la protección (y encima Python siempre prioriza
        # el .py sobre el binario si el .py es más nuevo en el path).
        run: |
          for base in motor proveedores_ia licencia; do
            if ls app-python/${base}*.pyd >/dev/null 2>&1; then
              rm -f "app-python/${base}.py"
              echo "protegido: ${base}.py reemplazado por $(ls app-python/${base}*.pyd)"
            fi
          done
      - name: Instalar NSIS (para compilar el instalador .exe del producto Python)
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Empaquetar el zip autoinstalable (con los .pyd si están)
        run: python3 tools/empaquetar_zip.py
      - name: Compilar instalador Windows (NSIS) del producto completo
        # OJO: el flag es "-D", no "/D" — este build de makensis (el mismo
        # paquete apt que corre acá) no reconoce la sintaxis estilo Windows
        # y falla con "Can't open script" si se usa "/D". Se detectó
        # probando la variante del propietario de abajo en un sandbox Linux
        # idéntico a este runner, antes de que rompiera en un release real.
        run: makensis "-DVERSION=${{ steps.version.outputs.version }}" installer/mvsql.nsi
      - name: Compilar instalador Windows (NSIS) — versión del propietario, sin límite de prueba
        # Para uso personal del dueño del producto. Ver installer/mvsql.nsi,
        # bloque "!ifdef PROPIETARIO": lleva embebida una licencia con
        # "vence":"2099-12-31" y exenta del trial de 7 días.
        run: makensis "-DVERSION=${{ steps.version.outputs.version }}" -DPROPIETARIO=1 installer/mvsql.nsi
      - name: Subir zip autoinstalable (.bat) al Release
        run: gh release upload "${{ steps.version.outputs.tag }}" web/downloads/mvsql-nlp-app.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Subir instalador .exe (NSIS) al Release
        run: gh release upload "${{ steps.version.outputs.tag }}" web/downloads/MV-SQL-NLP-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar el instalador del propietario como artefacto privado
        # NO va al Release. Este repo es público, y desde que
        # electron-builder publica con releaseType: release los Releases
        # dejaron de ser borradores: subir acá el .exe sin trial lo dejaba
        # a un clic de cualquiera, con licencia embebida hasta 2099. O sea
        # que el producto pago quedaba disponible gratis y sin vencimiento.
        #
        # Cuando el asset se agregó, los Releases SÍ eran borradores y solo
        # los veía quien tiene acceso al repo; el cambio a releaseType
        # arregló las descargas y de paso rompió ese supuesto, sin tocar
        # esta línea. Como artefacto de Actions vuelve a requerir acceso al
        # repositorio para bajarlo, que es lo que se quería desde el
        # principio.
        uses: actions/upload-artifact@v4
        with:
          name: mvsql-setup-owner
          path: web/downloads/MV-SQL-NLP-Setup-OWNER.exe
          retention-days: 90
          if-no-files-found: error
