# MV SQL NLP — configuración del instalador profesional (electron-builder)
appId: com.mvsql.nlp
productName: MV SQL NLP
copyright: © 2026 MV SQL NLP

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - electron/**
  - package.json
  # El proceso principal (electron/services/db.cjs) hace require() en tiempo
  # de ejecución de mssql/mysql2/pg/better-sqlite3 — sin node_modules
  # empaquetado, esos require() fallan apenas el usuario intenta conectar
  # una base (o antes, según el caso). No es opcional.
  - node_modules/**
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,.bin,*.map,test,tests,__tests__,example,examples,docs}"
  - "!node_modules/**/*.{ts,map}"

asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# La licencia del propietario, cuando existe, viaja como recurso de solo
# lectura al lado del asar — ahí la busca services/licencia.cjs. El
# archivo NO está en el repo (está en .gitignore) y lo escribe el
# workflow solo para la build owner, así que en la build de clientes el
# glob no matchea nada y el instalador sale sin licencia adentro.
# Esa es toda la diferencia entre las dos builds.
#
# Va en la raíz de desktop/ y no en build/ por cómo copia electron-builder:
# un patrón suelto conserva la ruta relativa, así que "build/licencia..."
# terminaría en resources/build/licencia_owner.json y licencia.cjs lo
# busca en resources/licencia_owner.json. Desde la raíz, la ruta relativa
# es el nombre solo y cae donde tiene que caer.
extraResources:
  - "licencia_owner.json"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  # nsis y portable producen ambos un .exe: si comparten el mismo nombre,
  # el segundo "pisa" al primero en el Release de GitHub y esa operación
  # de reemplazo se puede colgar (timeout). Nombres distintos por target.
  artifactName: "MV-SQL-NLP-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MV SQL NLP
  installerLanguages: [es_ES, en_US, pt_BR]
  license: build/LICENSE.txt
  runAfterFinish: true
  # customInit propio: la carpeta default de allowToChangeInstallationDirectory
  # arranca siempre en la unidad del perfil de Windows (casi siempre C:), sin
  # mirar cuál unidad fija tiene más espacio libre. Ver build/installer.nsh.
  include: build/installer.nsh
  # Nombre ESTABLE (sin la versión): la web enlaza directo a este archivo
  # con releases/latest/download/<nombre>, sin mandar al usuario a la página
  # de Releases. Distinto de "MV-SQL-NLP-Setup.exe" (el instalador del
  # producto Python/Streamlit): los dos conviven en el mismo Release y no
  # se pisan. Distinto también del portable, que sí lleva versión.
  artifactName: "MV-SQL-NLP-App-Setup.${ext}"

portable:
  artifactName: "MV-SQL-NLP-Portable-${version}.${ext}"

publish:
  provider: github
  owner: vieraschiavi
  repo: Mv-Sql
  # Sin esto, electron-builder crea el Release como borrador (draft) y no
  # aparece en la página pública de Releases hasta publicarlo a mano.
  releaseType: release
