<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago no completado — MV SQL NLP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23081527'/><path d='M57 12L27 60h20l-4 28 30-46H53l4-30z' fill='%23f2b441'/></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <style>.box { max-width: 32rem; margin: 8rem auto; text-align: center; padding: 0 1.4rem; }</style>
</head>
<body>
  <div class="box">
    <div class="mv-logo" style="font-size:1.6rem;font-weight:800"><svg viewBox='0 0 24 24' width='20' height='20' fill='#f2b441' style='vertical-align:-.15em;margin-right:.15em'><path d='M13 2L4 14h7l-1 8 9-12h-7l1-8z'/></svg> MV SQL <span class="grad-text">NLP</span></div>
    <h1 id="t" style="margin:1rem 0">El pago no se completó</h1>
    <p id="s" style="color:var(--muted);margin-bottom:1.6rem">
      No te preocupes, no se te cobró nada. Podés intentarlo de nuevo cuando quieras.
    </p>
    <a class="btn btn-primary" id="v" href="/#precios">Volver a intentar</a>
  </div>

  <script>
  // El cliente que compró en inglés o portugués tiene que ver también en su
  // idioma la página de "algo salió mal": es donde más se abandona.
  var TXT = {
    es: { titulo:"El pago no se completó",
          sub:"No te preocupes, no se te cobró nada. Podés intentarlo de nuevo cuando quieras.",
          volver:"Volver a intentar" },
    en: { titulo:"The payment didn't go through",
          sub:"Don't worry — you were not charged. You can try again whenever you want.",
          volver:"Try again" },
    pt: { titulo:"O pagamento não foi concluído",
          sub:"Fique tranquilo, nada foi cobrado. Você pode tentar de novo quando quiser.",
          volver:"Tentar de novo" }
  };
  (function () {
    var qs = new URLSearchParams(location.search).get('lang');
    var guardado = null;
    try { guardado = localStorage.getItem('mvsql_lang'); } catch (e) {}
    var lang = TXT[qs] ? qs : (TXT[guardado] ? guardado : 'es');
    var t = TXT[lang];
    document.documentElement.lang = lang;
    document.title = t.titulo + " — MV SQL NLP";
    document.getElementById('t').textContent = t.titulo;
    document.getElementById('s').textContent = t.sub;
    document.getElementById('v').textContent = t.volver;
    document.getElementById('v').href = "/?lang=" + lang + "#precios";
  })();
  </script>
</body>
</html>
