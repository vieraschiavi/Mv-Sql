<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias! — MV SQL NLP</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/seguro.js"></script>
  <style>
    .box { max-width: 34rem; margin: 8rem auto; text-align: center; padding: 0 1.4rem; }
    .box h1 { font-size: 2rem; margin-bottom: 1rem; }
    .box p { color: var(--muted); margin-bottom: 1.5rem; }
    .spin { width: 34px; height: 34px; border: 3px solid var(--border); border-top-color: var(--cyan);
            border-radius: 50%; margin: 2rem auto; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mv-logo" style="font-size:1.6rem;font-weight:800">⚡ MV SQL <span class="grad-text">NLP</span></div>
    <h1 id="title">Verificando tu pago…</h1>
    <p id="sub">Un segundo, confirmamos el pago con MercadoPago.</p>
    <div class="spin" id="spinner"></div>
    <div id="result"></div>
  </div>

  <script>
    // Esta es la página que ve todo el que paga: tiene que hablarle en el
    // idioma en que compró, no en castellano por defecto.
    const TXT = {
      es: {
        verificando: "Verificando tu pago…",
        esperando: "Un segundo, confirmamos el pago con MercadoPago.",
        falta_id: "Falta el identificador de pago",
        falta_id_sub: 'Volvé a <a href="{url}" style="color:#38bdf8">la página de compra</a> e intentá de nuevo.',
        pendiente: "El pago está pendiente",
        no_acreditado: "Todavía no se acreditó.",
        pendiente_sub: "Refrescá esta página en unos segundos, o escribinos a vieraschiavi@gmail.com con tu comprobante.",
        confirmado: "¡Pago confirmado! 🎉",
        con_creditos: "con créditos de IA embebidos",
        con_propia: "con tu propia IA (configurala en la app)",
        listo: "Tu descarga está lista, plan {plan} {modo}.",
        descargar: "⬇ Descargar MV SQL NLP",
        guarda: "Guardá este link — es tu licencia:",
        no_verificado: "No se pudo verificar el pago",
        no_verificado_sub: "Tu pago está a salvo. Reintentá en un momento; si sigue igual, escribinos a vieraschiavi@gmail.com con tu comprobante y te mandamos la descarga.",
        reintentar: "Reintentar"
      },
      en: {
        verificando: "Checking your payment…",
        esperando: "One moment — we're confirming the payment with MercadoPago.",
        falta_id: "The payment identifier is missing",
        falta_id_sub: 'Go back to <a href="{url}" style="color:#38bdf8">the purchase page</a> and try again.',
        pendiente: "The payment is still pending",
        no_acreditado: "It hasn't cleared yet.",
        pendiente_sub: "Refresh this page in a few seconds, or write to vieraschiavi@gmail.com with your receipt.",
        confirmado: "Payment confirmed! 🎉",
        con_creditos: "with embedded AI credits",
        con_propia: "with your own AI (set it up inside the app)",
        listo: "Your download is ready — {plan} plan {modo}.",
        descargar: "⬇ Download MV SQL NLP",
        guarda: "Save this link — it is your licence:",
        no_verificado: "We could not verify the payment",
        no_verificado_sub: "Your payment is safe. Try again in a moment; if it persists, write to vieraschiavi@gmail.com with your receipt and we will send you the download.",
        reintentar: "Try again"
      },
      pt: {
        verificando: "Verificando seu pagamento…",
        esperando: "Um segundo — estamos confirmando o pagamento com o MercadoPago.",
        falta_id: "Falta o identificador do pagamento",
        falta_id_sub: 'Volte para <a href="{url}" style="color:#38bdf8">a página de compra</a> e tente de novo.',
        pendiente: "O pagamento está pendente",
        no_acreditado: "Ainda não foi compensado.",
        pendiente_sub: "Atualize esta página em alguns segundos, ou escreva para vieraschiavi@gmail.com com o seu comprovante.",
        confirmado: "Pagamento confirmado! 🎉",
        con_creditos: "com créditos de IA embutidos",
        con_propia: "com a sua própria IA (configure dentro do app)",
        listo: "Seu download está pronto — plano {plan} {modo}.",
        descargar: "⬇ Baixar o MV SQL NLP",
        guarda: "Guarde este link — é a sua licença:",
        no_verificado: "Não foi possível verificar o pagamento",
        no_verificado_sub: "Seu pagamento está seguro. Tente de novo em instantes; se continuar, escreva para vieraschiavi@gmail.com com o seu comprovante e enviaremos o download.",
        reintentar: "Tentar de novo"
      }
    };

    const params = new URLSearchParams(location.search);
    const paymentId = params.get("payment_id") || params.get("collection_id");

    let guardado = null;
    try { guardado = localStorage.getItem('mvsql_lang'); } catch (e) {}
    const qsLang = params.get('lang');
    const LANG = TXT[qsLang] ? qsLang : (TXT[guardado] ? guardado : 'es');
    const T = TXT[LANG];
    const URL_COMPRA = "/?lang=" + LANG + "#precios";
    document.documentElement.lang = LANG;

    async function run() {
      const title = document.getElementById("title");
      const sub = document.getElementById("sub");
      const spinner = document.getElementById("spinner");
      const result = document.getElementById("result");

      title.textContent = T.verificando;
      sub.textContent = T.esperando;

      if (!paymentId) {
        spinner.style.display = "none";
        title.textContent = T.falta_id;
        // innerHTML [D] ESCAPADO: T.falta_id_sub es literal (lleva un <a>)
        // y LANG ya está validado contra las claves de TXT más arriba, así
        // que URL_COMPRA no puede traer HTML hoy — pero igual pasa por
        // escapeHTML() antes de entrar al innerHTML: así esta línea sigue
        // siendo segura aunque mañana URL_COMPRA se arme con algo menos
        // controlado (ej. un parámetro de la URL).
        sub.innerHTML = T.falta_id_sub.replace("{url}", MvSqlSeguro.escapeHTML(URL_COMPRA));
        return;
      }

      try {
        const r = await fetch(`/api/verify-and-issue?payment_id=${encodeURIComponent(paymentId)}`);

        // El JSON se parsea aparte y tolerando el fallo. Antes se hacía
        // `await r.json()` ANTES de mirar r.ok: si la API devolvía un 500
        // con HTML (error de Vercel, timeout de la función), el parseo
        // explotaba y el cliente que ACABABA DE PAGAR terminaba leyendo
        // "Unexpected token '<'... is not valid JSON".
        let data = null;
        try { data = await r.json(); } catch (_) { /* respuesta no-JSON */ }

        spinner.style.display = "none";

        if (!r.ok) {
          // 402 = pago todavía no acreditado: es un estado esperable y
          // tiene su propio texto. Cualquier otro código es un fallo
          // nuestro y no debe mostrarse como "el pago está pendiente".
          const esPendiente = r.status === 402;
          title.textContent = esPendiente ? T.pendiente : T.no_verificado;
          sub.textContent = "";
          const linea = document.createElement("span");
          linea.className = "err";
          linea.textContent = esPendiente
            ? ((data && data.error) || T.no_acreditado)
            : T.no_verificado_sub;
          sub.appendChild(linea);
          if (esPendiente) {
            sub.appendChild(document.createElement("br"));
            sub.appendChild(document.createTextNode(T.pendiente_sub));
          }
          mostrarReintento();
          return;
        }

        title.textContent = T.confirmado;
        const modoTxt = data.mode === "credits" ? T.con_creditos : T.con_propia;
        sub.textContent = T.listo.replace("{plan}", data.plan).replace("{modo}", modoTxt);

        const enlace = `${location.origin}/api/download?token=${encodeURIComponent(data.token)}`;
        result.textContent = "";
        const boton = document.createElement("a");
        boton.className = "btn btn-primary";
        boton.href = enlace;
        boton.textContent = T.descargar;
        const nota = document.createElement("p");
        nota.style.cssText = "color:var(--muted);font-size:.8rem;margin-top:1.2rem";
        nota.textContent = T.guarda + " ";
        const code = document.createElement("code");
        code.style.wordBreak = "break-all";
        code.textContent = enlace;
        nota.appendChild(document.createElement("br"));
        nota.appendChild(code);
        result.appendChild(boton);
        result.appendChild(nota);
      } catch (e) {
        // El detalle técnico va a la consola, no a la cara del cliente:
        // "Failed to fetch" no le dice nada y encima asusta a alguien que
        // acaba de pagar.
        console.error("verify-and-issue:", e);
        spinner.style.display = "none";
        title.textContent = T.no_verificado;
        sub.textContent = T.no_verificado_sub;
        mostrarReintento();
      }
    }

    function mostrarReintento() {
      const result = document.getElementById("result");
      result.textContent = "";
      const b = document.createElement("button");
      b.className = "btn btn-primary";
      b.textContent = T.reintentar;
      b.addEventListener("click", function () {
        document.getElementById("spinner").style.display = "";
        result.textContent = "";
        run();
      });
      result.appendChild(b);
    }

    run();
  </script>
</body>
</html>
